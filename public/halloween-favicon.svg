<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Dark Haunted Background Glow -->
  <rect x="2" y="4" width="12" height="10" fill="#1a0505" />
  <!-- Pumpkin Stem (Green) -->
  <rect x="7" y="1" width="2" height="2" fill="#15803d" />
  <rect x="8" y="0" width="2" height="1" fill="#166534" />
  <rect x="6" y="2" width="1" height="1" fill="#14532d" />
  <!-- Pumpkin Body (Pixel Art Jack-o'-Lantern) -->
  <rect x="4" y="3" width="8" height="1" fill="#ea580c" />
  <rect x="2" y="4" width="12" height="1" fill="#f97316" />
  <rect x="1" y="5" width="14" height="7" fill="#ea580c" />
  <rect x="2" y="5" width="12" height="7" fill="#f97316" />
  <!-- Pumpkin Ribs Shading -->
  <rect x="4" y="4" width="1" height="9" fill="#c2410c" />
  <rect x="11" y="4" width="1" height="9" fill="#c2410c" />
  <rect x="2" y="12" width="12" height="1" fill="#ea580c" />
  <rect x="4" y="13" width="8" height="1" fill="#9a3412" />
  <!-- Glowing Carved Eyes (Yellow/Amber Fire) -->
  <rect x="4" y="6" width="2" height="2" fill="#fde047" />
  <rect x="3" y="7" width="3" height="1" fill="#facc15" />
  <rect x="10" y="6" width="2" height="2" fill="#fde047" />
  <rect x="10" y="7" width="3" height="1" fill="#facc15" />
  <!-- Carved Nose -->
  <rect x="7" y="8" width="2" height="1" fill="#fef08a" />
  <!-- Glowing Jagged Smile -->
  <rect x="3" y="10" width="1" height="1" fill="#fde047" />
  <rect x="4" y="11" width="2" height="1" fill="#facc15" />
  <rect x="6" y="10" width="1" height="1" fill="#fde047" />
  <rect x="7" y="11" width="2" height="1" fill="#fef08a" />
  <rect x="9" y="10" width="1" height="1" fill="#fde047" />
  <rect x="10" y="11" width="2" height="1" fill="#facc15" />
  <rect x="12" y="10" width="1" height="1" fill="#fde047" />
</svg>
