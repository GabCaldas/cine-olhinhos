<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Background Glow -->
  <rect x="1" y="2" width="14" height="13" fill="#0f172a" />
  <!-- Clapperboard Top Bar (Striped Black & Gold) -->
  <rect x="2" y="2" width="12" height="3" fill="#18181b" />
  <rect x="3" y="2" width="2" height="3" fill="#f59e0b" />
  <rect x="7" y="2" width="2" height="3" fill="#f59e0b" />
  <rect x="11" y="2" width="2" height="3" fill="#f59e0b" />
  <!-- Clapperboard Hinge -->
  <rect x="2" y="4" width="2" height="2" fill="#fbbf24" />
  <!-- Clapperboard Slate Body -->
  <rect x="2" y="5" width="12" height="9" fill="#1e293b" />
  <rect x="3" y="6" width="10" height="7" fill="#090d16" />
  <!-- Pixel Heart / Star in Center of Slate -->
  <rect x="6" y="8" width="1" height="1" fill="#ef4444" />
  <rect x="9" y="8" width="1" height="1" fill="#ef4444" />
  <rect x="5" y="9" width="6" height="1" fill="#ef4444" />
  <rect x="6" y="10" width="4" height="1" fill="#dc2626" />
  <rect x="7" y="11" width="2" height="1" fill="#b91c1c" />
  <!-- Golden Border Lines -->
  <rect x="4" y="7" width="8" height="1" fill="#fbbf24" />
</svg>
